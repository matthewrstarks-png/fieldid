<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FieldID — Door Hardware</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');
  :root {
    --bg: #111318;
    --panel: #1a1e28;
    --border: #252c3d;
    --accent: #f0a500;
    --green: #00c853;
    --red: #e53935;
    --text: #d0d8ec;
    --dim: #4a5370;
    --mono: 'Share Tech Mono', monospace;
    --head: 'Barlow Condensed', sans-serif;
    --body: 'Barlow', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 40px;
  }
  .topbar {
    background: var(--panel);
    border-bottom: 2px solid var(--accent);
    padding: 14px 20px;
  }
  .topbar .logo { font-family: var(--mono); font-size: 1.05rem; color: var(--accent); letter-spacing: 0.1em; }
  .topbar .sub { font-family: var(--mono); font-size: 0.65rem; color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }
  .section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .section-label { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .key-row { display: flex; gap: 8px; }
  input[type="password"], input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }
  .btn-sm {
    background: var(--border);
    border: none;
    border-radius: 3px;
    color: var(--dim);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 0 12px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .tips {
    background: rgba(240,165,0,0.06);
    border: 1px solid rgba(240,165,0,0.2);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .tips p { font-size: 0.78rem; color: var(--text); line-height: 1.6; margin-bottom: 4px; }
  .tips p:last-child { margin-bottom: 0; }
  .tip-icon { color: var(--accent); margin-right: 6px; }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    cursor: pointer;
    padding: 32px 16px;
    text-align: center;
    position: relative;
    background: var(--bg);
  }
  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
    z-index: 2;
  }
  .drop-zone p { font-size: 0.82rem; color: var(--dim); }
  .drop-zone .drop-icon { font-size: 2rem; margin-bottom: 8px; display: block; }
  #preview {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    border-radius: 3px;
    display: none;
    margin-top: 12px;
    border: 1px solid var(--border);
  }
  .identify-btn {
    display: block;
    width: calc(100% - 40px);
    margin: 16px 20px 0;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #111;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 16px;
    text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .identify-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .identify-btn:not(:disabled):active { opacity: 0.8; }
  .spinner { display: none; text-align: center; padding: 24px 20px; font-family: var(--mono); font-size: 0.8rem; color: var(--accent); letter-spacing: 0.1em; }
  .spinner.active { display: block; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .spinner span { animation: pulse 1.2s infinite; }
  #result { display: none; padding: 0 20px; margin-top: 16px; }
  .result-header { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.15em; color: var(--green); text-transform: uppercase; margin-bottom: 10px; }
  .result-item { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; position: relative; }
  .result-item.top { border-color: var(--accent); }
  .result-rank { font-family: var(--mono); font-size: 0.65rem; color: var(--dim); letter-spacing: 0.1em; margin-bottom: 6px; }
  .result-item.top .result-rank { color: var(--accent); }
  .result-mfr { font-family: var(--head); font-size: 1.3rem; font-weight: 700; color: var(--text); letter-spacing: 0.04em; line-height: 1.2; }
  .result-partnum { font-family: var(--mono); font-size: 1rem; color: var(--accent); margin-top: 4px; letter-spacing: 0.06em; }
  .result-type { font-size: 0.8rem; color: var(--dim); margin-top: 4px; }
  .result-confidence { position: absolute; top: 14px; right: 14px; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 2px; }
  .conf-high { background: rgba(0,200,83,0.15); color: var(--green); }
  .conf-medium { background: rgba(240,165,0,0.15); color: var(--accent); }
  .conf-low { background: rgba(229,57,53,0.15); color: #ef9a9a; }
  .result-notes { font-size: 0.78rem; color: var(--dim); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.5; }
  .copy-btn { display: block; width: 100%; margin-top: 12px; background: var(--border); border: none; border-radius: 3px; color: var(--text); cursor: pointer; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em; padding: 10px; text-transform: uppercase; }
  .copy-btn.copied { color: var(--green); }
  .new-photo-btn { display: block; width: 100%; margin-top: 8px; background: transparent; border: 1px solid var(--border); border-radius: 3px; color: var(--dim); cursor: pointer; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; padding: 10px; text-transform: uppercase; }
  .error-box { background: var(--panel); border: 1px solid var(--red); border-radius: 4px; padding: 14px 16px; font-size: 0.82rem; color: #ef9a9a; line-height: 1.5; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">&#9642; FIELD ID</div>
  <div class="sub">Door Hardware Identification</div>
</div>

<div class="section">
  <div class="section-label">API Key</div>
  <div class="key-row">
    <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" />
    <button class="btn-sm" onclick="toggleKey()">SHOW</button>
  </div>
</div>

<div class="section">
  <div class="section-label">Photo Tips</div>
  <div class="tips">
    <p><span class="tip-icon">&#9654;</span>Fill the frame with the hardware</p>
    <p><span class="tip-icon">&#9654;</span>Remove covers before shooting closers</p>
    <p><span class="tip-icon">&#9654;</span>Capture any visible labels or stampings</p>
    <p><span class="tip-icon">&#9654;</span>Use flash in low light conditions</p>
  </div>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFile(this.files[0])" />
    <span class="drop-icon">&#128247;</span>
    <p>Tap to take or select a photo</p>
  </div>
  <img id="preview" alt="preview" />
</div>

<button class="identify-btn" id="identifyBtn" onclick="identify()" disabled>&#9654; Identify Hardware</button>
<div class="spinner" id="spinner"><span>Analyzing hardware...</span></div>
<div id="result"></div>

<script>
  let selectedFile = null;

  function toggleKey() {
    const inp = document.getElementById('apiKey');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    event.target.textContent = inp.type === 'password' ? 'SHOW' : 'HIDE';
  }

  function handleFile(file) {
    if (!file) return;
    selectedFile = file;
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    checkReady();
  }

  document.getElementById('apiKey').addEventListener('input', checkReady);

  function checkReady() {
    document.getElementById('identifyBtn').disabled =
      !(document.getElementById('apiKey').value.trim() && selectedFile);
  }

  async function identify() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key || !selectedFile) return;

    document.getElementById('identifyBtn').disabled = true;
    document.getElementById('spinner').classList.add('active');
    document.getElementById('result').style.display = 'none';

    try {
      const b64 = await toBase64(selectedFile);
      const mediaType = selectedFile.type || 'image/jpeg';

      const prompt = `You are a commercial door hardware expert with 20 years of field experience identifying parts for distributors and technicians.

Analyze this photo and return the top 3 possible identifications. Use ONLY this exact format, no other text:

RESULT_1_MANUFACTURER: [brand name e.g. LCN, Von Duprin, Schlage, Sargent, Norton, Dorma]
RESULT_1_PART_NUMBER: [exact manufacturer part number as it would appear in a catalog or on the box, e.g. 1-4840 EDA or 4040XP-EDA or CO-200-S]
RESULT_1_DESCRIPTION: [product type in 5 words max, e.g. Parallel Arm Closer Arm Assembly]
RESULT_1_FINISH: [finish code if visible, e.g. 689, 626, 630, US26D]
RESULT_1_CONFIDENCE: [high/medium/low]
RESULT_1_NOTES: [any visible stampings, labels, or reason for uncertainty]

RESULT_2_MANUFACTURER: 
RESULT_2_PART_NUMBER: 
RESULT_2_DESCRIPTION: 
RESULT_2_FINISH: 
RESULT_2_CONFIDENCE: 
RESULT_2_NOTES: 

RESULT_3_MANUFACTURER: 
RESULT_3_PART_NUMBER: 
RESULT_3_DESCRIPTION: 
RESULT_3_FINISH: 
RESULT_3_CONFIDENCE: 
RESULT_3_NOTES: 

Critical rules:
- PART_NUMBER must be an actual orderable part number, not a series name
- If you can read a stamping or label on the hardware, use that exact number
- If a cover is present that prevents identification, say REMOVE COVER in NOTES
- Never invent part numbers — use low confidence and explain in NOTES if unsure`;

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-6',
          max_tokens: 1024,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
              { type: 'text', text: prompt }
            ]
          }]
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `API error ${response.status}`);
      }

      const data = await response.json();
      showResult(data.content[0].text);

    } catch (err) {
      document.getElementById('result').innerHTML =
        `<div class="error-box">&#9888; ${err.message}<br><br>Check your API key and try again.</div>`;
      document.getElementById('result').style.display = 'block';
    } finally {
      document.getElementById('spinner').classList.remove('active');
      document.getElementById('identifyBtn').disabled = false;
    }
  }

  function parse(text, prefix) {
    const map = {};
    for (const line of text.split('\n')) {
      const colon = line.indexOf(':');
      if (colon === -1) continue;
      const key = line.substring(0, colon).trim();
      const val = line.substring(colon + 1).trim();
      if (key.startsWith(prefix)) map[key.replace(prefix, '')] = val;
    }
    return map;
  }

  function confClass(c) {
    if (!c) return 'conf-medium';
    const l = c.toLowerCase();
    if (l.includes('high')) return 'conf-high';
    if (l.includes('low')) return 'conf-low';
    return 'conf-medium';
  }

  function showResult(text) {
    const results = [parse(text,'RESULT_1_'), parse(text,'RESULT_2_'), parse(text,'RESULT_3_')];
    let copyText = 'DOOR HARDWARE IDENTIFICATION\n============================\n';
    let html = '<div class="result-header">&#10003; Identification Complete</div>';

    results.forEach((r, i) => {
      if (!r.MANUFACTURER && !r.PART_NUMBER) return;
      const isTop = i === 0;
      const rankLabel = ['TOP MATCH', 'ALTERNATIVE 2', 'ALTERNATIVE 3'][i];
      const conf = r.CONFIDENCE || '';

      html += `<div class="result-item${isTop ? ' top' : ''}">
        <div class="result-rank">${rankLabel}</div>
        <span class="result-confidence ${confClass(conf)}">${conf.toUpperCase()}</span>
        <div class="result-mfr">${r.MANUFACTURER || '—'}</div>
        <div class="result-partnum">${r.PART_NUMBER || '—'}</div>
        <div class="result-type">${r.DESCRIPTION || ''} ${r.FINISH ? '· ' + r.FINISH : ''}</div>
        ${r.NOTES ? `<div class="result-notes">${r.NOTES}</div>` : ''}
      </div>`;

      copyText += `\n${rankLabel}\nManufacturer: ${r.MANUFACTURER||'—'}\nPart Number: ${r.PART_NUMBER||'—'}\nDescription: ${r.DESCRIPTION||'—'}\nFinish: ${r.FINISH||'—'}\nConfidence: ${conf}\n`;
      if (r.NOTES) copyText += `Notes: ${r.NOTES}\n`;
    });

    html += `<button class="copy-btn" id="copyBtn" onclick="copyResult()">&#9632; Copy to Clipboard</button>`;
    html += `<button class="new-photo-btn" onclick="resetPhoto()">Take Another Photo</button>`;

    window._copyText = copyText;
    const el = document.getElementById('result');
    el.innerHTML = html;
    el.style.display = 'block';
  }

  function copyResult() {
    navigator.clipboard.writeText(window._copyText || '').then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '⬛ Copy to Clipboard'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function resetPhoto() {
    selectedFile = null;
    const preview = document.getElementById('preview');
    preview.style.display = 'none';
    preview.src = '';
    document.getElementById('result').style.display = 'none';
    document.getElementById('fileInput').value = '';
    checkReady();
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
